name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上的旧任务自动取消，省时间也省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 · 测试 · 构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # node:sqlite 需要较新的 Node 24
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 shared（其它包依赖它的 dist）
        run: pnpm --filter @tavern/shared build

      - name: 全仓类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build
